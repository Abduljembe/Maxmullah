<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2338"/>
      <stop offset="100%" stop-color="#07090E"/>
    </radialGradient>
    <linearGradient id="mullahGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cinemaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  
  <!-- Outer Film Reel Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#mullahGold)" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- MullahMax Iconic M Glyph with Play Crown -->
  <g filter="url(#glow)">
    <!-- Left Stalk -->
    <path d="M 128 368 L 128 164 C 128 152 140 144 150 150 L 256 248 L 362 150 C 372 144 384 152 384 164 L 384 368 C 384 374 378 380 372 380 L 334 380 C 328 380 322 374 322 368 L 322 248 L 268 298 C 261 304 251 304 244 298 L 190 248 L 190 368 C 190 374 184 380 178 380 L 140 380 C 134 380 128 374 128 368 Z" fill="url(#cinemaRed)"/>
    
    <!-- Central Golden Cinema Play Triangle Emblem -->
    <polygon points="236,206 288,236 236,266" fill="url(#mullahGold)"/>

    <!-- Crown Dots / 4K Ultra Stars -->
    <circle cx="139" cy="120" r="10" fill="url(#mullahGold)"/>
    <circle cx="256" cy="96" r="14" fill="url(#mullahGold)"/>
    <circle cx="373" cy="120" r="10" fill="url(#mullahGold)"/>
  </g>
</svg>
